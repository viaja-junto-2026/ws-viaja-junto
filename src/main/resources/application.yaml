spring:
  application:
    name: ws-viaja-junto
  datasource:
    url: jdbc:h2:mem:viajajuntodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  # O H2 console só é habilitado no perfil "dev" (ver application-dev.yaml).
  h2:
    console:
      enabled: false
  # data.sql (dados de exemplo) só roda no perfil "dev" (ver application-dev.yaml). O H2 é em memória:
  # fora do "dev" o schema é criado e descartado a cada execução, sem "update".
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # data.sql roda depois que o Hibernate cria as tabelas.
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  firebase:
    # ID do projeto no Firebase Authentication. A API só aceita tokens emitidos para este projeto.
    # Obrigatório via variável de ambiente, sem valor padrão fora do perfil "dev".
    project-id: ${FIREBASE_PROJECT_ID}
  cors:
    # Lista separada por vírgula. Vazio = nenhuma origem externa permitida.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cache:
    places:
      ttl: 24h # validade das buscas do Google Places guardadas em cache
      maximum-size: 1000
  integrations:
    google:
      # Só por variável de ambiente. Vazio = sem integração (a busca devolve resposta vazia).
      places-api-key: ${GOOGLE_PLACES_API_KEY:}
      places-base-url: https://maps.googleapis.com/maps/api/place

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Vazio = DynamoDB real da AWS. O emulador local é configurado no perfil "dev".
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    # Obrigatórias via variável de ambiente, sem valor padrão fora dos perfis "dev" e de teste.
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    table-name: Avaliacoes

# Documentação da API (Swagger UI e /v3/api-docs): só habilitada no perfil "dev" (ver application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
