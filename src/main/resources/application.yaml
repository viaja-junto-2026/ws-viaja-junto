spring:
  application:
    name: ws-viaja-junto
  datasource:
    url: jdbc:h2:mem:viajajuntodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24h
  integrations:
    google:
      places-api-key: ${GOOGLE_PLACES_API_KEY:mock-key}
      places-base-url: https://maps.googleapis.com/maps/api/place

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:http://localhost:4566}
    access-key-id: ${AWS_ACCESS_KEY_ID:fakeAccessKey}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:fakeSecretKey}
    table-name: Avaliacoes


