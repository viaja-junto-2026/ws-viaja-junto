spring:
  application:
    name: ws-viaja-junto
  datasource:
    url: jdbc:h2:mem:viajajuntodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  # O H2 console só é habilitado no perfil "dev" (ver application-dev.yaml).
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Obrigatório via variável de ambiente (mínimo 32 caracteres). Sem valor padrão fora do perfil "dev".
    secret: ${JWT_SECRET}
    expiration-ms: 86400000 # 24h
  cors:
    # Lista separada por vírgula. Vazio = nenhuma origem externa permitida.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  integrations:
    google:
      # Só por variável de ambiente. Vazio = sem integração (a busca devolve resposta vazia).
      places-api-key: ${GOOGLE_PLACES_API_KEY:}
      places-base-url: https://maps.googleapis.com/maps/api/place

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    # Vazio = DynamoDB real da AWS. O emulador local é configurado no perfil "dev".
    endpoint: ${AWS_DYNAMODB_ENDPOINT:}
    # Obrigatórias via variável de ambiente, sem valor padrão fora dos perfis "dev" e de teste.
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    table-name: Avaliacoes
