name: Tests

on:
  # Em PR roda a verificação; em push só na main (evita rodar duas vezes a cada commit de PR).
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  tests:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # verify = testes + relatório do JaCoCo + regra de cobertura mínima (ver pom.xml).
      # O lint tem job próprio (Lint (Checkstyle)), então não é repetido aqui.
      - name: Run tests with coverage
        run: mvn -B clean verify -Dcheckstyle.skip=true

      # O runner tem Docker: os testes com Testcontainers devem rodar. Se algum aparecer como ignorado, falha.
      - name: Fail if any test was skipped
        run: |
          if grep -l "<skipped" target/surefire-reports/*.xml; then
            echo "::error::Há testes ignorados (veja os arquivos acima). No CI nenhum teste deve ser pulado."
            exit 1
          fi

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
