name: Lint OpenAPI Contract

on:
  # Em PR roda a verificação; em push só na main (evita rodar duas vezes a cada commit de PR).
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  spectral:
    name: Run Spectral Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Spectral Lint
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141 # v0.8.13
        with:
          file_glob: 'docs/viajajunto-openapi.json'
