name: Lint

on:
  # Em PR roda a verificação; em push só na main (evita rodar duas vezes a cada commit de PR).
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  checkstyle:
    name: Lint (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Regras em config/checkstyle/checkstyle.xml, todas com severidade "error": qualquer violação falha o job.
      - name: Run Checkstyle
        run: mvn -B checkstyle:check

      - name: Upload Checkstyle report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
