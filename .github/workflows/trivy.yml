name: Trivy Security Scan

on:
  # Em PR roda a verificação; em push só na main (evita rodar duas vezes a cada commit de PR).
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  trivy-scan:
    name: Build and Scan with Trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t viajajunto-api:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'viajajunto-api:latest'
          format: 'table'
          exit-code: '1' # Reprova o build se houver vulnerabilidade HIGH ou CRITICAL
          severity: 'HIGH,CRITICAL'
          # Exceções justificadas e com validade (ver .trivyignore).
          trivyignores: '.trivyignore'
